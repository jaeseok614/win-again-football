name: Game source verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  billing-worker-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node source/test-billing-worker.cjs
      - name: Bundle optional free Worker without publishing or cloud credentials
        run: npx --yes wrangler@4 deploy --dry-run --config billing-server/wrangler.jsonc --outdir work/billing-worker-bundle
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node source/run-tests.cjs
      - run: python3 -m unittest source.release.test_verify_play_bundle source.release.test_verify_store_assets
      - run: python3 source/release/verify_store_assets.py
      - run: node source/build-pwa.cjs
      - run: node source/test-pwa.cjs index.html
        env:
          PWA_DIST: .
      - run: node source/build-android.cjs
      - name: Verify committed public assets match source
        run: git diff --exit-code -- index.html cache-assets.js manifest.webmanifest sw.js source/dist/cache-assets.js

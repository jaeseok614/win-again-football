name: Android app build
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android API ${{ matrix.api-level }}
    strategy:
      fail-fast: false
      matrix:
        api-level: [34, 35]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify native assets and export bridge
        run: node source/test-android.cjs
      - name: Prepare offline assets
        run: node source/build-android.cjs
      - name: Compile APK, unsigned Play bundle, and lint
        working-directory: android
        run: bash ./gradlew --no-daemon assembleDebug bundleRelease lintDebug assembleDebugAndroidTest
      - name: Upload installable debug APK and unsigned release AAB
        uses: actions/upload-artifact@v4
        with:
          name: win-again-android-api${{ matrix.api-level }}-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/reports/lint-results-debug.html
            android/app/src/main/assets/game/build-info.json
          if-no-files-found: error
          retention-days: 30
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify game on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 3072M
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -feature -Vulkan
          working-directory: android
          disable-animations: true
          script: |
            # The disposable Google image's launcher ANR can cover the tested app.
            # Disable that unrelated launcher only; app ANRs still fail the tests.
            adb shell pm disable-user --user 0 com.google.android.apps.nexuslauncher
            adb shell am force-stop com.google.android.apps.nexuslauncher
            # The APK is already compiled. Leave RAM for the emulator and UTP.
            free -m
            mkdir -p app/build/outputs/emulator-diagnostics
            # Preserve the guest's last test stage even if UTP loses the device.
            adb logcat -b all -v threadtime > app/build/outputs/emulator-diagnostics/guest.log 2>&1 &
            logcat_pid=$!
            trap 'kill "$logcat_pid" 2>/dev/null || true' EXIT
            bash ./gradlew --no-daemon --max-workers=1 -Dorg.gradle.jvmargs="-Xmx1024m -Dfile.encoding=UTF-8" connectedDebugAndroidTest
      - name: Capture emulator host diagnostics
        if: always()
        run: |
          mkdir -p android/app/build/outputs/emulator-diagnostics
          free -m > android/app/build/outputs/emulator-diagnostics/host-memory.log
          sudo dmesg --ctime | tail -80 > android/app/build/outputs/emulator-diagnostics/host-kernel.log
      - name: Upload emulator verification and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win-again-android-verification-api${{ matrix.api-level }}-${{ github.sha }}
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/app/build/outputs/connected_android_test_additional_output/
            android/app/build/outputs/emulator-diagnostics/
          if-no-files-found: warn
          retention-days: 30

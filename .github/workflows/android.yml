name: Android app build
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify native assets and export bridge
        run: node source/test-android.cjs
      - name: Prepare offline assets
        run: node source/build-android.cjs
      - name: Compile APK, unsigned Play bundle, and lint
        working-directory: android
        run: bash ./gradlew --no-daemon assembleDebug bundleRelease lintDebug assembleDebugAndroidTest
      - name: Upload installable debug APK and unsigned release AAB
        uses: actions/upload-artifact@v4
        with:
          name: win-again-android-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/reports/lint-results-debug.html
            android/app/src/main/assets/game/build-info.json
          if-no-files-found: error
          retention-days: 30
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify game on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: cd android && bash ./gradlew --no-daemon connectedDebugAndroidTest
      - name: Upload emulator verification and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win-again-android-verification-${{ github.sha }}
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/app/build/outputs/connected_android_test_additional_output/
          if-no-files-found: warn
          retention-days: 30

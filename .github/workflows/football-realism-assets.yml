name: Rebuild generated assets for football realism PR
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/football-realism-20261012'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node source/build-pwa.cjs
      - run: node source/build-android.cjs
      - name: Commit generated web assets
        run: |
          git add index.html cache-assets.js manifest.webmanifest sw.js source/dist/cache-assets.js
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Build PWA assets for football realism update"
            git push origin HEAD:${{ github.head_ref }}
          fi
